[manager]
show_hidden = true
sort_by = "natural"
sort_dir_first = true

[preview]
wrap = "no"

[plugin]
# Disable built-in media preview and preload for these file types.
prepend_previewers = [
	{ mime = "image/*", run = "noop" },
	{ mime = "application/pdf", run = "noop" },
	{ mime = "audio/*", run = "noop" },
	{ mime = "video/*", run = "noop" },
]
prepend_preloaders = [
	{ mime = "image/*", run = "noop" },
	{ mime = "application/pdf", run = "noop" },
	{ mime = "audio/*", run = "noop" },
	{ mime = "video/*", run = "noop" },
]
