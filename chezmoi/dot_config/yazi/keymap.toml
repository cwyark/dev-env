[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/projects"
desc = "Go to my projects"

[[mgr.prepend_keymap]]
on   = [ "g", "d", "n" ]
run  = "cd ~/SynologyDrive/Notes/Obsidian/cwyark"
desc = "Go to my notes"

[[mgr.prepend_keymap]]
on   = [ "g", "d", "s" ]
run  = "cd ~/SynologyDrive/"
desc = "Go to my drive"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Downloads"
desc = "Go to ~/Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "1" ]
run  = "cd sftp://cdevpc"
desc = "Go to cdevpc"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "2" ]
run  = "cd sftp://cdevpc-tailscale"
desc = "Go to cdevpc-tailscale"

[[mgr.prepend_keymap]]
on   = [ "C", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "C", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "C", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "C", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "C", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[[mgr.prepend_keymap]]
on   = [ "M", "s"]
run  = "plugin sshfs -- menu"
desc = "Open SSHFS options"
